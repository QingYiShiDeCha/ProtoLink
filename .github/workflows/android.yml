name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 打 tag 时创建 Release 用

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # 让每个 tag 的包里带着自己的版本号，装到手机上能分辨是哪一版
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          V="${GITHUB_REF_NAME#v}"
          CODE=$(echo "$V" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/versionCode .*/versionCode ${CODE}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${V}\"/" app/build.gradle
          grep -E "versionCode |versionName " app/build.gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 用 debug 变体：自带 debug 签名，装到手机即可用。
      # Capacitor 模板的 release 没配签名，assembleRelease 出的是未签名包，装了会失败。
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: protolink-debug-apk
          path: out/*.apk
          retention-days: 14

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
